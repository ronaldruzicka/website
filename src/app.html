<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function () {
				document.documentElement.classList.add('js');

				const prefers_reduced_motion = globalThis.matchMedia(
					'(prefers-reduced-motion: reduce)',
				).matches;
				const stored_theme = globalThis.localStorage.getItem('theme');
				const system_prefers_dark = globalThis.matchMedia(
					'(prefers-color-scheme: dark)',
				).matches;
				const should_use_dark = stored_theme
					? stored_theme === 'dark'
					: system_prefers_dark;

				document.documentElement.classList.toggle('dark', should_use_dark);
				document.documentElement.classList.toggle(
					'motion-safe',
					!prefers_reduced_motion,
				);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
