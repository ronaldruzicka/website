name: Svelte Check

on:
  pull_request:

jobs:
  svelte-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Scripts use `node --experimental-strip-types` (Node 22+). The runner
      # default `node` can be older, which makes that flag invalid.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Run svelte check
        run: bun run check
